<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beto Saver - The Memory Aid</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle fill='%23007BFF' cx='50' cy='50' r='50'/><path fill='white' d='M30 25c0-2.76 2.24-5 5-5h30c2.76 0 5 2.24 5 5v45c0 2.76-2.24 5-5 5H35c-2.76 0-5-2.24-5-5V25z'/><circle fill='%23007BFF' cx='45' cy='35' r='3'/><circle fill='%23007BFF' cx='45' cy='45' r='3'/><circle fill='%23007BFF' cx='45' cy='55' r='3'/><path fill='%23007BFF' d='M52 33h12v4H52z'/><path fill='%23007BFF' d='M52 43h12v4H52z'/><path fill='%23007BFF' d='M52 53h8v4h-8z'/></svg>" type="image/svg+xml">
</head>
<body>
    
    <header class="primary-header">
        <h1 class="app-logo">
            <span class="blue-char">B</span>eto <span class="blue-char">S</span>aver
        </h1>
        <div class="header-actions">
            
            <label for="import-file" class="action-button">
                <i class="far fa-arrow-alt-circle-down"></i> <span>Import</span>
            </label>
            <input type="file" id="import-file" accept=".json" style="display: none;">
            
            <label for="export-button-hidden" class="action-button" id="export-button">
                <i class="far fa-arrow-alt-circle-up"></i> <span>Export</span>
            </label>
            <input type="hidden" id="export-button-hidden">

            <button id="delete-all-button" class="action-button action-button-delete" title="Delete All Topics">
                <i class="fas fa-trash"></i> <span>Delete All Cards</span>
            </button>

            <button id="mode-toggle-button" class="button-icon" title="Toggle Dark/Light Mode">
                <i class="fas fa-moon"></i> 
            </button>
        </div>
    </header>

    <header class="secondary-header">
        <div class="search-sort-group">
            <input type="text" id="search-input" placeholder="Search by Title or Tag..." aria-label="Search saved topics">
            
            <div class="custom-dropdown">
                <button class="dropdown-trigger" id="sort-trigger" aria-label="Sort topics by">
                    <span id="sort-label">Newest First</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-menu" id="sort-menu">
                    <button class="dropdown-item active" data-value="newest">Newest First</button>
                    <button class="dropdown-item" data-value="oldest">Oldest First</button>
                    <button class="dropdown-item" data-value="title-asc">Title (A-Z)</button>
                    <button class="dropdown-item" data-value="title-desc">Title (Z-A)</button>
                </div>
            </div>
            <input type="hidden" id="sort-by-select" value="newest">
        </div>
        
        <button id="new-topic-button" class="primary-button" title="Create New Topic">
            <i class="fas fa-plus"></i> New Topic
        </button>
    </header>
    
    <main class="card-grid" id="card-grid">
        <p id="no-cards-message" style="text-align: center; color: var(--text-color-secondary); display: none;">No topics saved yet. Click "New Topic" to start!</p>
    </main>

    <div id="topic-modal" class="modal" aria-modal="true" role="dialog">
        <div class="modal-content">
            <span class="close-button" id="close-modal-button">&times;</span>
            <h2 id="modal-title">Create New Topic</h2>
            
            <form id="topic-form" class="form-grid">
                <input type="hidden" id="topic-id">
                
                <div class="form-column-left">
                    
                    <div class="form-group">
                        <label for="topic-title">Title</label>
                        <input type="text" id="topic-title" required maxlength="100">
                    </div>
                    
                    <div class="form-group">
                        <label for="topic-url">Source URL (Optional)</label>
                        <input type="url" id="topic-url" placeholder="http://example.com/source">
                    </div>
                    
                    <div class="form-group">
                        <label for="topic-tags">Tags (Comma separated, e.g., js, react, notes)</label>
                        <input type="text" id="topic-tags" placeholder="tag1, tag2, tag3">
                    </div>
                    
                </div>
                <div class="form-group content-group"> 
                    <label>Content Utilities</label>
                    <div class="utility-bar">
                        <button type="button" class="util-button" id="bold-btn" title="Bold">
                            <i class="fas fa-bold"></i>
                        </button>
                        <button type="button" class="util-button" id="underline-btn" title="Underline">
                            <i class="fas fa-underline"></i>
                        </button>
                        <button type="button" class="util-button" id="italic-btn" title="Italic">
                            <i class="fas fa-italic"></i>
                        </button>
                        <span class="util-separator">|</span>
                        <button type="button" class="util-color-button color-blue" data-color="blue" title="Text Color: Blue">
                            <i class="fas fa-palette"></i>
                        </button>
                        <button type="button" class="util-color-button color-yellow" data-color="yellow" title="Text Color: Yellow">
                            <i class="fas fa-palette"></i>
                        </button>
                        <button type="button" class="util-color-button color-red" data-color="red" title="Text Color: Red">
                            <i class="fas fa-palette"></i>
                        </button>
                        <button type="button" class="util-button" id="clear-format-btn" title="Clear Formatting">
                            <i class="fas fa-eraser"></i>
                        </button>
                    </div>
                    <label for="topic-content" style="display: none;">Content</label>
                    <div id="topic-content" class="rich-text-area" contenteditable="true" aria-multiline="true" required></div>
                </div>

                <button type="submit" class="primary-button" id="save-topic-button">Save Topic</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script> 
</body>
</html>
